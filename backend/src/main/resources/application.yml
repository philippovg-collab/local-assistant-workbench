server:
  port: 8080

spring:
  application:
    name: spring-backend
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/ragstudio}"
    username: "${SPRING_DATASOURCE_USERNAME:ragstudio}"
    password: "${SPRING_DATASOURCE_PASSWORD:ragstudio}"
    driver-class-name: org.postgresql.Driver
  elasticsearch:
    uris: "${SPRING_ELASTICSEARCH_URIS:http://127.0.0.1:9200}"
    username: "${SPRING_ELASTICSEARCH_USERNAME:}"
    password: "${SPRING_ELASTICSEARCH_PASSWORD:}"
  servlet:
    multipart:
      max-file-size: "${app.materials.max-upload-bytes:8388608}B"
      max-request-size: "${app.materials.max-upload-request-bytes:9437184}B"

app:
  cors:
    allowed-origins: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173
  llm:
    base-url: "${APP_LLM_BASE_URL:http://127.0.0.1:11434}"
    model: "${APP_LLM_MODEL:qwen2.5:7b}"
    api-key: "${APP_LLM_API_KEY:}"
    temperature: 0.2
    top-p: "${APP_LLM_TOP_P:0.9}"
    timeout-seconds: 600
    system-prompt: Ты локальная LLM модель. Отвечай по делу и понятно на русском языке.
  llm-provider:
    secret-key: "${APP_LLM_PROVIDER_SECRET_KEY:}"
  materials:
    max-upload-bytes: 8388608
    max-upload-request-bytes: 9437184
    max-text-chars: 200000
    max-pdf-pages: 200
    tika-write-limit-chars: 250000
    tika-embedded-resources-enabled: false
    chunk-size: 900
    chunk-overlap: 180
    max-chunks: 24
    chunk-profile: structured-v1
    extraction-timeout-seconds: 10
    legacy-import-enabled: false
    indexing-lease-seconds: 120
    indexing-max-attempts: 3
    indexing-retry-base-seconds: 5
    indexing-retry-max-seconds: 60
    indexing-worker-count: 2
    indexing-drain-max-jobs: 64
    auto-tags:
      llm-enabled: true
      max-input-chars: 16000
      short-target: 5
      medium-target: 10
      large-target: 16
      timeout-seconds: 8
  instructions:
    legacy-import-enabled: false
  ocr:
    enabled: true
    binary-path: tesseract
    languages: kaz+rus+eng
    timeout-seconds: 20
    max-pages: 12
    render-dpi: 200
    min-text-threshold: 5
    max-rendered-image-bytes: 15000000
    max-temp-file-bytes: 15000000
  embeddings:
    base-url: "${APP_EMBEDDINGS_BASE_URL:}"
    api-key: "${APP_EMBEDDINGS_API_KEY:}"
    model: "${APP_EMBEDDINGS_MODEL:nomic-embed-text}"
    timeout-seconds: "${APP_EMBEDDINGS_TIMEOUT_SECONDS:60}"
    expected-dimension: "${APP_EMBEDDINGS_EXPECTED_DIMENSION:768}"
  rag:
    semantic-candidate-limit: 12
    lexical-candidate-limit: 12
    final-context-limit: 4
    max-search-limit: 20
    rerank-candidate-limit: 12
    max-semantic-distance: 0.72
    lexical-provider: postgres
    relevance-profile: hybrid-rerank-v1
    shadow-enabled: false
    shadow-sample-percent: 10
  rollout:
    metadata-v1: false
    structured-v1: false
    structured-v1-proof-compare-id: "${APP_ROLLOUT_STRUCTURED_V1_PROOF_COMPARE_ID:}"
    metadata-filters-v1: false
    search-api-v1: false
    reranker-v1: false
    query-hints-v1: false
  context:
    enabled: false
    conversations-enabled: false
    history-enabled: false
    sticky-state-enabled: false
    retrieval-query-resolution-enabled: false
    summary-enabled: false
    long-term-memory-enabled: false
    max-recent-turns: 6
    max-history-tokens: 2000
    summary-refresh-turns: 6
    summary-max-input-turns: 12
    summary-max-output-chars: 2500
    summary-max-facts: 12
    summary-max-active-entities: 20
    summary-max-source-refs: 20
    summary-max-attempts: 3
    summary-retry-base-seconds: 30
    summary-retry-max-seconds: 300
    memory-extraction-lease-seconds: 120
    memory-extraction-max-attempts: 3
    memory-extraction-retry-base-seconds: 30
    memory-extraction-retry-max-seconds: 300
    memory-extraction-worker-count: 1
    memory-extraction-drain-max-jobs: 50
    memory-selection-limit: 8
    retention:
      enabled: true
      snapshot-days: 30
      summary-job-days: 14
      memory-rejected-days: 30
      memory-deleted-days: 30
      memory-job-days: 14
      deleted-conversation-days: 30
      empty-conversation-days: 7
      keep-latest-snapshots-per-conversation: 5
      batch-size: 500
  health:
    readiness-cache-seconds: 30
    readiness-probe-interval-millis: 30000
    readiness-initial-delay-millis: 1000
  audit:
    fail-closed: false
    health-failure-threshold: 1
    retention-days: 30
    redaction-enabled: "${APP_AUDIT_REDACTION_ENABLED:true}"
    store-raw-llm-response: "${APP_AUDIT_STORE_RAW_LLM_RESPONSE:false}"
    store-request-messages: "${APP_AUDIT_STORE_REQUEST_MESSAGES:true}"
    max-stored-text-chars: "${APP_AUDIT_MAX_STORED_TEXT_CHARS:12000}"
  operator-audit:
    retention-days: "${APP_OPERATOR_AUDIT_RETENTION_DAYS:90}"
  request:
    max-json-bytes: 1048576
  security:
    enabled: true
    admin-username: "${APP_SECURITY_ADMIN_USERNAME:admin}"
    admin-password: "${APP_SECURITY_ADMIN_PASSWORD:}"
  chat-execution:
    threads: 2
    queue-capacity: 32
    poll-interval-millis: 1000
    compatibility-wait-timeout-seconds: "${APP_CHAT_EXECUTION_COMPATIBILITY_WAIT_TIMEOUT_SECONDS:30}"
    claim-lease-seconds: 300
    max-attempts: 2
  eval:
    e2e:
      reconciler-enabled: "${APP_EVAL_E2E_RECONCILER_ENABLED:true}"
      reconcile-delay-ms: "${APP_EVAL_E2E_RECONCILE_DELAY_MS:5000}"
      chat-run-timeout-ms: "${APP_EVAL_E2E_CHAT_RUN_TIMEOUT_MS:0}"
  search-sync:
    enabled: false
    index-prefix: rag-chunks
    index-version: v3
    claim-batch-size: 32
    claim-lease-seconds: 120
    max-attempts: 3
    retry-base-seconds: 5
    retry-max-seconds: 60
    max-drain-batches: 16
    max-bulk-actions: 500
    max-outstanding-seconds: 120
    max-failed-events-before-fallback: 0
    health-snapshot-ttl-seconds: 15
    operator:
      enabled: false
      wait-timeout-seconds: 300
      poll-interval-millis: 250
  storage-dir: ./storage
