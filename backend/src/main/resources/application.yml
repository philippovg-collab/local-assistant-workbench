server:
  port: 8080

spring:
  application:
    name: spring-backend
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/ragstudio}"
    username: "${SPRING_DATASOURCE_USERNAME:ragstudio}"
    password: "${SPRING_DATASOURCE_PASSWORD:ragstudio}"
    driver-class-name: org.postgresql.Driver
  elasticsearch:
    uris: "${SPRING_ELASTICSEARCH_URIS:http://127.0.0.1:9200}"
    username: "${SPRING_ELASTICSEARCH_USERNAME:}"
    password: "${SPRING_ELASTICSEARCH_PASSWORD:}"
  servlet:
    multipart:
      max-file-size: "${app.materials.max-upload-bytes:8388608}B"
      max-request-size: "${app.materials.max-upload-request-bytes:9437184}B"

app:
  cors:
    allowed-origins: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173
  llm:
    base-url: http://127.0.0.1:11434
    model: qwen2.5:7b
    temperature: 0.2
    timeout-seconds: 600
    system-prompt: Ты локальная LLM модель. Отвечай по делу и понятно на русском языке.
  materials:
    max-upload-bytes: 8388608
    max-upload-request-bytes: 9437184
    max-text-chars: 200000
    max-pdf-pages: 200
    tika-write-limit-chars: 250000
    tika-embedded-resources-enabled: false
    chunk-size: 900
    chunk-overlap: 180
    max-chunks: 24
    chunk-profile: structured-v1
    extraction-timeout-seconds: 10
    legacy-import-enabled: false
    indexing-lease-seconds: 120
    indexing-max-attempts: 3
    indexing-retry-base-seconds: 5
    indexing-retry-max-seconds: 60
    indexing-drain-max-jobs: 64
  instructions:
    legacy-import-enabled: false
  ocr:
    enabled: true
    binary-path: tesseract
    languages: kaz+rus+eng
    timeout-seconds: 20
    max-pages: 12
    render-dpi: 200
    min-text-threshold: 5
    max-rendered-image-bytes: 15000000
    max-temp-file-bytes: 15000000
  embeddings:
    model: nomic-embed-text
    timeout-seconds: 60
    expected-dimension: 768
  rag:
    semantic-candidate-limit: 12
    lexical-candidate-limit: 12
    final-context-limit: 4
    max-search-limit: 20
    rerank-candidate-limit: 12
    max-semantic-distance: 0.72
    lexical-provider: postgres
    relevance-profile: hybrid-rerank-v1
    shadow-enabled: false
    shadow-sample-percent: 10
  rollout:
    metadata-v1: true
    structured-v1: false
    metadata-filters-v1: false
    search-api-v1: false
    reranker-v1: false
    query-hints-v1: false
  health:
    readiness-cache-seconds: 30
    readiness-probe-interval-millis: 30000
    readiness-initial-delay-millis: 1000
  audit:
    fail-closed: false
    health-failure-threshold: 1
    retention-days: 30
  request:
    max-json-bytes: 1048576
  security:
    enabled: true
    admin-username: "${APP_SECURITY_ADMIN_USERNAME:admin}"
    admin-password: "${APP_SECURITY_ADMIN_PASSWORD:}"
  chat-execution:
    threads: 2
    queue-capacity: 32
    poll-interval-millis: 1000
    claim-lease-seconds: 300
  search-sync:
    enabled: false
    index-prefix: rag-chunks
    index-version: v3
    claim-batch-size: 32
    claim-lease-seconds: 120
    max-attempts: 3
    retry-base-seconds: 5
    retry-max-seconds: 60
    max-drain-batches: 16
    max-bulk-actions: 500
    max-outstanding-seconds: 120
    max-failed-events-before-fallback: 0
    health-snapshot-ttl-seconds: 15
    operator:
      enabled: false
      wait-timeout-seconds: 300
      poll-interval-millis: 250
  storage-dir: ./storage
