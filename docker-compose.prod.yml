services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragstudio}
      POSTGRES_USER: ${POSTGRES_USER:-ragstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ${HOME}/contextHub/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragstudio} -d ${POSTGRES_DB:-ragstudio}"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    profiles: ["search"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - ${HOME}/contextHub/elasticsearch:/usr/share/elasticsearch/data

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/kazinsys-ai/rag-backend:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ragstudio}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ragstudio}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      APP_STORAGE_DIR: /app/storage
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-qwen2.5:7b}
      APP_LLM_TIMEOUT_SECONDS: ${APP_LLM_TIMEOUT_SECONDS:-600}
      APP_LLM_PROVIDER_SECRET_KEY: ${APP_LLM_PROVIDER_SECRET_KEY:-}
      APP_EMBEDDINGS_BASE_URL: ${APP_EMBEDDINGS_BASE_URL:-}
      APP_EMBEDDINGS_API_KEY: ${APP_EMBEDDINGS_API_KEY:-}
      APP_EMBEDDINGS_MODEL: ${APP_EMBEDDINGS_MODEL:-nomic-embed-text}
      APP_EMBEDDINGS_TIMEOUT_SECONDS: ${APP_EMBEDDINGS_TIMEOUT_SECONDS:-60}
      APP_EMBEDDINGS_EXPECTED_DIMENSION: ${APP_EMBEDDINGS_EXPECTED_DIMENSION:-768}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS must be set}
      APP_SEARCH_SYNC_ENABLED: ${APP_SEARCH_SYNC_ENABLED:-false}
      SPRING_ELASTICSEARCH_URIS: ${SPRING_ELASTICSEARCH_URIS:-http://elasticsearch:9200}
      APP_SEARCH_SYNC_INDEX_VERSION: ${APP_SEARCH_SYNC_INDEX_VERSION:-v3}
      APP_RAG_LEXICAL_PROVIDER: ${APP_RAG_LEXICAL_PROVIDER:-postgres}
      APP_OCR_ENABLED: ${APP_OCR_ENABLED:-false}
      APP_OCR_BINARY_PATH: ${APP_OCR_BINARY_PATH:-tesseract}
      APP_OCR_LANGUAGES: ${APP_OCR_LANGUAGES:-kaz+rus+eng}
      APP_SECURITY_ADMIN_USERNAME: ${APP_SECURITY_ADMIN_USERNAME:-admin}
      APP_SECURITY_ADMIN_PASSWORD: ${APP_SECURITY_ADMIN_PASSWORD:?APP_SECURITY_ADMIN_PASSWORD must be set}
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--Xms512m -Xmx2g}
    volumes:
      - ${HOME}/contextHub/storage:/app/storage
    expose:
      - "8080"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/kazinsys-ai/rag-frontend:latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HTTP_PORT:-8088}:80"
