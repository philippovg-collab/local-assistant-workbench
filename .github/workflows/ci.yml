name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/rag-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/rag-frontend
  GIT_SSL_NO_VERIFY: "true"
  MAVEN_OPTS: "-Dmaven.resolver.transport=wagon -Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true -Dmaven.wagon.http.ssl.ignore.validity.dates=true"
  NODE_TLS_REJECT_UNAUTHORIZED: "0"

jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Phase 5 static anti-regression gate
        run: python3 scripts/phase5-static-gate.py

      - name: Run architecture boundary gate
        run: python3 scripts/architecture-boundary-gate.py

      - name: Run complexity budget gate
        run: python3 scripts/complexity-budget-gate.py

      - name: Run review contract diff gate
        run: python3 scripts/review-contract.py --skip-body

  quality-gates:
    runs-on: ubuntu-latest
    needs: static-gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Disable npm strict SSL
        run: npm config set strict-ssl false
        working-directory: frontend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run fast quality gates
        run: bash scripts/quality-gates.sh fast

  backend:
    runs-on: ubuntu-latest
    needs: quality-gates
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: mvn -B clean verify -Pcoverage

      - name: Check backend coverage ratchet
        run: python3 ../scripts/coverage-ratchet.py backend

      - name: Fail if integration tests were skipped
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          reports_dir = pathlib.Path("target/failsafe-reports")
          report_paths = sorted(reports_dir.glob("TEST-*.xml"))
          if not report_paths:
            print("Integration quality gate failed: no failsafe reports were produced", file=sys.stderr)
            sys.exit(1)

          skipped = []
          for report_path in report_paths:
            root = ET.parse(report_path).getroot()
            skipped_count = int(root.attrib.get("skipped", "0"))
            if skipped_count > 0:
              skipped.append((report_path.name, skipped_count))

          if skipped:
            details = ", ".join(f"{name} skipped={count}" for name, count in skipped)
            print(f"Integration quality gate failed: skipped tests detected: {details}", file=sys.stderr)
            sys.exit(1)
          PY

  backend-java25-smoke:
    runs-on: ubuntu-latest
    needs: quality-gates
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run Java 25 smoke suite
        run: mvn -q -Dtest=HealthControllerTest,MaterialServiceTest,PdfDocumentExtractionStrategyTest test

  frontend:
    runs-on: ubuntu-latest
    needs: quality-gates
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Disable npm strict SSL
        run: npm config set strict-ssl false

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:coverage

      - name: Check frontend coverage ratchet
        run: python3 ../scripts/coverage-ratchet.py frontend

      - name: Build frontend
        run: npm run build

  images:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Disable npm strict SSL
        run: npm config set strict-ssl false
        working-directory: frontend

      - name: Build backend artifact
        run: mvn -B -DskipTests package
        working-directory: backend

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            --tag "${BACKEND_IMAGE}:${GITHUB_SHA}" \
            --tag "${BACKEND_IMAGE}:latest" \
            -f backend/Dockerfile \
            .

      - name: Build frontend image
        run: |
          docker build \
            --tag "${FRONTEND_IMAGE}:${GITHUB_SHA}" \
            --tag "${FRONTEND_IMAGE}:latest" \
            -f frontend/Dockerfile \
            .

      - name: Push backend image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"
          docker push "${BACKEND_IMAGE}:latest"

      - name: Push frontend image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"
          docker push "${FRONTEND_IMAGE}:latest"
