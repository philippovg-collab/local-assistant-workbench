name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/rag-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/rag-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIT_SSL_NO_VERIFY: "true"
      MAVEN_OPTS: "-Dmaven.resolver.transport=wagon -Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true -Dmaven.wagon.http.ssl.ignore.validity.dates=true"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Disable npm strict SSL
        run: npm config set strict-ssl false
        working-directory: frontend

      - name: Build backend artifact
        run: mvn -B -DskipTests package
        working-directory: backend

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            --tag "${BACKEND_IMAGE}:${GITHUB_SHA}" \
            --tag "${BACKEND_IMAGE}:latest" \
            -f backend/Dockerfile \
            .

      - name: Build frontend image
        run: |
          docker build \
            --tag "${FRONTEND_IMAGE}:${GITHUB_SHA}" \
            --tag "${FRONTEND_IMAGE}:latest" \
            -f frontend/Dockerfile \
            .

      - name: Push backend image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"
          docker push "${BACKEND_IMAGE}:latest"

      - name: Push frontend image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"
          docker push "${FRONTEND_IMAGE}:latest"
