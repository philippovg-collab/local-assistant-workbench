name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: self-hosted
    env:
      GIT_SSL_NO_VERIFY: "true"
      MAVEN_OPTS: "-Dmaven.resolver.transport=wagon -Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true -Dmaven.wagon.http.ssl.ignore.validity.dates=true"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Disable npm strict SSL
        run: npm config set strict-ssl false

      - name: Build backend artifact on runner
        run: mvn -B -DskipTests package
        working-directory: backend

      - name: Build production env file
        env:
          DEPLOY_ENV_PRODUCTION: ${{ secrets.DEPLOY_ENV_PRODUCTION }}
        run: |
          cp .env.production.defaults .env.production
          if [ -n "${DEPLOY_ENV_PRODUCTION}" ]; then
            printf '\n%s\n' "$DEPLOY_ENV_PRODUCTION" >> .env.production
          fi

      - name: Prepare persistent directories
        run: |
          mkdir -p "$HOME/contextHub/postgres" "$HOME/contextHub/storage" "$HOME/contextHub/elasticsearch"

      - name: Deploy with docker compose
        run: |
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --remove-orphans

      - name: Run deployment preflight
        run: ./scripts/linux/preflight-compose.sh

      - name: Prune dangling images
        run: docker image prune -f
