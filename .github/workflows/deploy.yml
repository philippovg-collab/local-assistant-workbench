name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production env file
        env:
          DEPLOY_ENV_PRODUCTION: ${{ secrets.DEPLOY_ENV_PRODUCTION }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_ENV_PRODUCTION}" ]; then
            echo "DEPLOY_ENV_PRODUCTION secret must provide production secrets." >&2
            exit 1
          fi

          cp .env.production.defaults .env.production
          printf '\n%s\n' "$DEPLOY_ENV_PRODUCTION" >> .env.production

          validate_secret() {
            name="$1"
            value="$(awk -F= -v key="$name" '$1 == key { found = 1; value = substr($0, length(key) + 2) } END { if (found) print value }' .env.production | tr -d '\r')"
            normalized="$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              ""|admin|password|secret|local-admin-password|change-me|change-me-admin|ragstudio|replace-with-*)
                echo "$name must be set to a non-placeholder production secret." >&2
                exit 1
                ;;
            esac
          }

          validate_secret POSTGRES_PASSWORD
          validate_secret APP_SECURITY_ADMIN_PASSWORD

      - name: Prepare persistent directories
        run: |
          mkdir -p "$HOME/contextHub/postgres" "$HOME/contextHub/storage" "$HOME/contextHub/elasticsearch"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with docker compose
        run: |
          set -euo pipefail

          dump_compose_state() {
            docker compose --env-file .env.production -f docker-compose.prod.yml ps || true
            docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=200 postgres backend frontend || true
          }

          trap dump_compose_state ERR

          docker compose --env-file .env.production -f docker-compose.prod.yml pull
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans
          docker compose --env-file .env.production -f docker-compose.prod.yml ps

          for attempt in $(seq 1 30); do
            if docker compose --env-file .env.production -f docker-compose.prod.yml ps --services --status running | grep -qx postgres; then
              break
            fi
            sleep 2
          done

          docker compose --env-file .env.production -f docker-compose.prod.yml ps --services --status running | grep -qx postgres

      - name: Run deployment preflight
        run: |
          set -euo pipefail
          dump_compose_state() {
            docker compose --env-file .env.production -f docker-compose.prod.yml ps || true
            docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=200 postgres backend frontend || true
          }

          trap dump_compose_state ERR
          ./scripts/linux/preflight-compose.sh

      - name: Prune dangling images
        run: docker image prune -f
