sonar.projectKey=philippovg-collab_local-assistant-workbench
sonar.organization=philippovg-collab
sonar.projectName=Local Assistant Workbench
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=backend/src/test/**/*.java,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.exclusions=backend/target/**,frontend/dist/**,frontend/node_modules/**,frontend/coverage/**
